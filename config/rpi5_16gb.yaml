hardware:
  platform: "rpi5_16gb"
  cpu_cores: 4
  ram_gb: 16
  storage: "nvme"            
  cooling: "active"          
  acceleration: "cpu_arm_neon" # Options: "cpu_arm_neon", "hailo_8_npu", "coral_tpu"
  neon_simd: true
  fp16_dotprod: true          

capture:
  resolution: [640, 480]     
  fps: 30
  camera_type: "usb"         

surveillance:
  ssim_threshold: 0.92       
  trigger_model: "models/mobilenetv3_small_int8.onnx"
  trigger_confidence: 0.6    
  temporal_filter:
    enabled: true
    window_size: 5           # FIFO window of consecutive frames (N)
    hit_threshold: 3         # Minimum positive hits required (K)
    cooldown_frames: 15      # Frames before re-triggering burst alert

danger:
  model: "models/moondream2-q4_k_m.gguf"
  engine: "llama_cpp"
  threads: 2                 
  max_response_tokens: 256
  temperature: 0.1           
  cascaded_verification:
    enabled: true
    low_conf_threshold: 0.10 # Ultra-sensitive candidate capture (Recall > 92%)
    high_conf_threshold: 0.65 # Direct pass-through without VLM
    crop_padding_ratio: 0.20 # Context margin around suspect crops
  sahi:
    enabled: false           # High-resolution tiled slicing (enable for 1080p/4K)
    slice_size: [384, 384]
    overlap_ratio: 0.20

mapping:
  interval_seconds: 300      
  keyframes_per_cycle: 3     
  
  object_detection:
    model: "models/florence2_large_int8.onnx"
    engine: "onnx_runtime"
    task_prompt: "<OD>"
  
  depth_estimation:
    model: "models/depthvlm-4b-q4_k_m.gguf"
    engine: "llama_cpp"
    threads: 2

thermal:
  warning_temp_c: 75
  throttle_temp_c: 80        
  critical_temp_c: 85        

logging:
  level: "INFO"
  output: "data/logs/"
  max_size_mb: 100
